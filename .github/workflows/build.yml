name: Build HCOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep every main-branch push so each successful push can publish its EFI.
concurrency:
  group: hcos-${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck qemu-system-x86 ovmf

      - name: Check scripts
        run: make check

      - name: Build EFI image
        run: make build

      - name: Verify EFI contents
        run: make verify

      - name: Boot EFI image in QEMU
        run: make smoke

      - name: Upload EFI image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hcos-efi
          path: dist/hcos.efi
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download EFI image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hcos-efi
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="hcos-${GITHUB_SHA}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/hcos.efi --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" dist/hcos.efi \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "HCOS ${GITHUB_SHA:0:12}"
          fi
